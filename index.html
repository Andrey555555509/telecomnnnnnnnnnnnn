<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мир Телефонов</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5}
header{background:#0078ff;color:#fff;text-align:center;padding:20px}
nav{background:#005fcc;text-align:center;padding:10px}
nav a{color:#fff;text-decoration:none;margin:0 15px}
.container{max-width:1200px;margin:auto;padding:20px}
.phones{display:flex;gap:20px;flex-wrap:wrap}
.card{background:#fff;border-radius:10px;padding:15px;width:300px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.card img{width:100%;border-radius:10px}
.btn{display:inline-block;background:#0078ff;color:#fff;padding:10px 15px;text-decoration:none;border-radius:5px;margin-top:10px}
footer{text-align:center;padding:20px;background:#222;color:#fff;margin-top:30px}
</style>
</head>
<body>
<header>
<h1>📱 Мир Телефонов</h1>
<p>Обзоры, характеристики и новинки смартфонов</p>
</header>
<nav>
<a href="#home">Главная</a>
<a href="#phones">Телефоны</a>
<a href="#contact">Контакты</a>
</nav>
<div class="container">
<h2 id="phones">Популярные смартфоны</h2>
<div class="phones">
<div class="card">
<img src="https://via.placeholder.com/300x200" alt="iPhone">
<h3>iPhone</h3>
<p>Современный смартфон Apple.</p>
<a class="btn" href="https://www.apple.com">Подробнее</a>
</div>
<div class="card">
<img src="https://via.placeholder.com/300x200" alt="Samsung">
<h3>Samsung Galaxy</h3>
<p>Флагманский Android-смартфон.</p>
<a class="btn" href="https://www.samsung.com">Подробнее</a>
</div>
</div>
</div>
<footer id="contact">
<p>© 2026 Мир Телефонов</p>
</footer>
</body>
</html>
